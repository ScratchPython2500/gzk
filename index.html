<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暑假时间安排表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
	font-family: "WenQuanYi Micro Hei", "PingFang SC", "Microsoft YaHei", sans-serif;
	background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 50%, #fce7f3 100%);
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 32px 16px;
	color: #1f2937;
  }
  .card {
	width: 100%;
	max-width: 760px;
	background: rgba(255,255,255,0.85);
	backdrop-filter: blur(10px);
	border-radius: 24px;
	box-shadow: 0 20px 50px rgba(0,0,0,0.12);
	overflow: hidden;
  }
  .header {
	background: linear-gradient(135deg, #38bdf8, #a78bfa);
	color: #fff;
	text-align: center;
	padding: 36px 24px 30px;
	position: relative;
  }
  .header h1 { font-size: 34px; letter-spacing: 2px; font-weight: 800; }
  .header p { margin-top: 8px; font-size: 14px; opacity: 0.9; letter-spacing: 1px; }
  .sun { font-size: 44px; position: absolute; top: 16px; right: 24px; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
	background: #f1f5f9;
	color: #475569;
	font-size: 15px;
	padding: 16px 12px;
	text-align: center;
	font-weight: 700;
	border-bottom: 2px solid #e2e8f0;
  }
  thead th:first-child { color: #0ea5e9; }
  tbody td {
	padding: 18px 12px;
	text-align: center;
	font-size: 16px;
	border-bottom: 1px solid #f1f5f9;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: #fafbff; }
  .period {
	font-weight: 800;
	color: #6366f1;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
  }
  .icon { font-size: 20px; }
  .time {
	color: #111827;
	font-weight: 600;
	background: #eef2ff;
	border-radius: 10px;
	padding: 6px 12px;
	display: inline-block;
  }
  .time.unset {
	color: #94a3b8;
	background: #f1f5f9;
	font-weight: 500;
  }
  .footer {
	padding: 16px 24px 22px;
	text-align: center;
	font-size: 13px;
	color: #94a3b8;
	background: #fafbff;
  }
  .legend {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	background: #f1f5f9;
	padding: 6px 14px;
	border-radius: 20px;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; }
</style>
</head>
<body>
  <div class="card">
	<div class="header">
	  <div class="sun">☀️</div>
	  <h1>暑假上线时间</h1>
	  <p>合理规划 · 快乐假期</p>
	</div>
	<table>
	  <thead>
		<tr>
		  <th>时间</th>
		  <th>周一到周五</th>
		  <th>周末</th>
		</tr>
	  </thead>
	  <tbody>
		<tr>
		  <td><span class="period"><span class="icon">🌅</span>上午</span></td>
		  <td><span class="time">10:00 - 12:00</span></td>
		  <td><span class="time unset">未定</span></td>
		</tr>
		<tr>
		  <td><span class="period"><span class="icon">🌞</span>下午</span></td>
		  <td><span class="time">1:00 - 4:00</span></td>
		  <td><span class="time unset">未定</span></td>
		</tr>
		<tr>
		  <td><span class="period"><span class="icon">🌙</span>晚上</span></td>
		  <td><span class="time">8:40 - 10:20</span></td>
		  <td><span class="time unset">未定</span></td>
		</tr>
	  </tbody>
	</table>
	<div class="footer">
	  <span class="legend"><span class="dot"></span>“未定”表示该项时间不固定</span>
	</div>
  </div>
</body>
</html>
